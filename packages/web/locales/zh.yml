about:
  content: >
    # 关于 LocalJson
    
    一个基于Wails实现的轻量化跨平台工具集，支持Web端和Mac、Windows和Linux等桌面端。
    
    ## 桌面版技术栈
    
    该项目前端基于[Vue3](https://github.com/vuejs/vue)、[Vite](https://github.com/vitejs/vite)、[Naive-UI](https://github.com/tusen-ai/naive-ui)和TypeScript实现的[It-Tools](https://github.com/CorentinTh/it-tools)，
    桌面端基于Go实现的[Wails](https://github.com/wailsapp/wails), 同时感谢其他开源项目。
    
    ## 桌面版发现Bug
    
    如果您发现了LocalJson-Desktop Bug，或者某些功能未能按预期工作，可以在 GitHub 仓库的 [issues](https://github.com/inRemark/localjson/issues/new/choose) 中提交错误报告。

    # 关于 IT-Tools

    IT-Tools 由 [Corentin Thomasset](https://github.com/CorentinTh) 用 ❤ 开发，汇集了对开发人员和 IT 从业者有用的工具。如果对您有帮助，请将其分享给您的朋友，并且添加转收藏夹中！

    IT-Tools 永久免费且开源（MIT 许可证），但需要资金用于托管和续订域名。如果您想支持我的工作，并鼓励我添加更多工具，请考虑通过 [赞助我](https://www.buymeacoffee.com/cthmsst) 进行支持。

    ## 技术

    IT-Tools 采用 Vue.js（Vue 3）和 Naive UI 组件库开发，并由 Vercel 托管和持续部署。某些工具使用了第三方开源库，您可以在仓库的 [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) 文件中找转完整的列表。

    ## 发现了 Bug？缺少工具？

    如果目前这里没有您需要的工具，并且您认为它可能有用，欢迎在 GitHub 仓库的 [issues](https://github.com/CorentinTh/it-tools/issues/new/choose) 中提交新增功能的请求。

    如果您发现了 Bug，或者某些功能未能按预期工作，请在 GitHub 仓库的 [issues](https://github.com/CorentinTh/it-tools/issues/new/choose) 中提交错误报告。

