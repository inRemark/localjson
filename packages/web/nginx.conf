server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ads.txt / robots.txt / sitemap.xml 必须是真实静态文件，不能回落到 SPA
    location ~ ^/(sitemap\.xml|robots\.txt|ads\.txt)$ {
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}